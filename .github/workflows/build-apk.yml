name: Build Standalone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Webview Android App
        run: |
          # Generate minimal package.json
          npm init -y
          
          # Standardize HTML filename if space exists
          if [ -f "index html" ]; then mv "index html" index.html; fi
          
          # Create web directory structure
          mkdir -p www
          cp -r index.html css js assets www/ 2>/dev/null || cp index.html www/
          
          # Install dependencies and configure Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat << 'CEOF' > capacitor.config.json
          {
            "appId": "com.techrolim.raulcoder",
            "appName": "Raul Coder",
            "webDir": "www"
          }
          CEOF

          # Add Android platform and assemble APK
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaulCoder-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
