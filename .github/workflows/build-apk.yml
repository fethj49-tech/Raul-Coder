name: Build Standalone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          
          # Fix filename if space exists
          if [ -f "index html" ]; then mv "index html" index.html; fi
          
          # Create fresh Cordova app wrapper
          cordova create build_app com.techrolim.raulcoder "RaulCoder"
          
          # Copy your web assets into Cordova www directory
          rm -rf build_app/www/*
          cp -r index.html css js assets build_app/www/ 2>/dev/null || cp index.html build_app/www/
          
          cd build_app
          cordova platform add android@latest
          
          # Build using project's Gradle wrapper instead of system Gradle 9.x
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaulCoder-Debug-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
