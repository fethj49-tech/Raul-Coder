name: Build RaulCoder APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          
          # Initialize Cordova app folder
          cordova create build_app com.techrolim.raulcoder "RaulCoder"
          
          # Clear default template and copy web files
          rm -rf build_app/www/*
          cp -r index.html css js assets build_app/www/ 2>/dev/null || cp index.html build_app/www/
          cp config.xml build_app/config.xml
          
          cd build_app
          cordova platform add android@latest
          
          # Build using internal Gradle wrapper
          cd platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaulCoder-Debug-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
